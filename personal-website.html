<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jaqueline Martinez | Personal Website</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #222;
      --muted: #5b6470;
      --line: #d9dee5;
      --paper: #fff;
      --background: #f5f7f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 48px 20px;
      background: var(--background);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 40px;
      background: var(--paper);
      border: 1px solid #e8ebef;
      border-radius: 10px;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      color: #d94f8c;

      margin-bottom: 8px;
      font-size: clamp(2rem, 6vw, 2.8rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .intro { color: var(--muted); margin-bottom: 0; }

    section { padding: 28px 0; }
    section + section { border-top: 1px solid var(--line); }
    section:last-child { padding-bottom: 0; }

    h2 {
      margin-bottom: 8px;
      font-size: 1.15rem;
      line-height: 1.35;
    }

    section p { margin-bottom: 0; color: #424a54; }

    @media (max-width: 520px) {
      body { padding: 20px 12px; }
      main { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Jaqueline Martinez</h1>
      <p class="intro">Senior studying CSRE and Human Rights at Stanford University</p>
    </header>

    <section aria-labelledby="research-heading">
      <h2 id="research-heading">Research Interests</h2>
      <p>Policing and surveillance with the use of AI.</p>
    </section>

    <section aria-labelledby="project-heading">
      <h2 id="project-heading">Class Project Idea</h2>
      <p>Analyze the impact of AI on the contemporary immigration landscape.</p>
    </section>
  </main>
</body>
</html>
